<main>

    <div class="box" id="heading">
  <h1 class="mb-4 text-center">Contact</h1>
</div>

<div class="container box mt-5">
  <h1 class="mb-4 text-center">Contactez-nous</h1>

  <form action="/contact" method="POST" class="card p-4 shadow-sm contact-form">
    <div class="mb-3">
      <label for="name" class="form-label">Nom</label>
      <input type="text" class="form-control" id="name" name="name" placeholder="Votre nom" required>
    </div>

    <div class="mb-3">
      <label for="email" class="form-label">Adresse email</label>
      <input type="email" class="form-control" id="email" name="email" placeholder="votre@email.com" required>
    </div>

    <div class="mb-3">
      <label for="message" class="form-label">Message</label>
      <textarea class="form-control" id="message" name="message" rows="5" placeholder="Votre message..." required></textarea>
    </div>

    <button type="submit" class="btn btn-brown w-auto">Envoyer</button>
  </form>
</div>
